[build]
  # Drop ffmpeg binaries from the Functions bundle (too large for Netlify's 250MB limit).
  command = "npm install && npm uninstall ffmpeg-static --no-save"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  # Keep the bundle small — do not ship ffmpeg binaries or the full googleapis tree as externals.
  external_node_modules = ["express", "serverless-http", "multer"]
  included_files = ["lib/**", "server.js"]

[functions."server"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/server/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/server/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
