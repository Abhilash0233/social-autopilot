[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "express",
    "serverless-http",
    "@supabase/supabase-js",
    "@anthropic-ai/sdk",
    "googleapis",
    "multer",
    "tus-js-client",
    "ffmpeg-static"
  ]
  included_files = ["lib/**", "server.js", "public/**"]

[functions."server"]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "/.netlify/functions/server/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/server/media/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
